# The lint configuration for the whole repository. It lives here, in the
# published package, so that the analysis_options.yaml in the package's
# archive is self-contained; the repository root's file includes this one.

include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_return: error
    unused_import: error
    unused_local_variable: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - use_super_parameters
