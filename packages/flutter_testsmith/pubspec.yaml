name: flutter_testsmith
description: >-
  In-application instrumentation for Flutter Testsmith.
  Captures navigation, UI structure and network traffic in test mode, and
  exposes them to the out-of-process test engine.
version: 0.1.3
repository: https://github.com/yogeshalai/flutter-testsmith/tree/main/packages/flutter_testsmith
issue_tracker: https://github.com/yogeshalai/flutter-testsmith/issues
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0
  flutter_testsmith_protocol: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

  # Dev-only, and that distinction is the whole reason this is allowed.
  #
  # The Figma defect matrix has to run all three sides of the comparison
  # together: real Flutter widgets, the real UiTreeInspector, and the
  # real engine verdict against a real normalised design. Only a package
  # that links Flutter can build the widgets, and only the engine can
  # judge them.
  #
  # `dev_dependencies` are never resolved for a consumer, so a `path:`
  # here cannot reach an application - which is what E-01 established and
  # what scripts/package_boundaries.dart enforces by examining
  # `dependencies:` alone. The engine still never ships inside an app.
  flutter_testsmith_engine:
    path: ../flutter_testsmith_engine
  flutter_testsmith_figma:
    path: ../../integrations/flutter_testsmith_figma
