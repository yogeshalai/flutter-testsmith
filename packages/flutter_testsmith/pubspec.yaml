name: flutter_testsmith
description: >-
  End-to-end testing for Flutter: an in-app SDK and the testsmith CLI,
  validating each screen against its API response, widget tree, Figma
  design and screenshot baseline.
version: 0.1.4
repository: https://github.com/yogeshalai/flutter-testsmith/tree/main/packages/flutter_testsmith
issue_tracker: https://github.com/yogeshalai/flutter-testsmith/issues
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0

  # The engine, CLI, Figma and AI components' dependencies
  # (lib/src/{engine,cli,figma,ai}, ADR-0011). The application under test
  # never links them: nothing reachable from lib/flutter_testsmith.dart
  # imports engine, CLI, Figma or AI code, which
  # scripts/check_dependencies.dart enforces as rule A. The SDK and the
  # protocol (lib/src/protocol) need only flutter and meta, above.
  args: ^2.6.0
  image: ^4.9.2
  vm_service: ^15.0.0
  yaml: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  # The engine's and the CLI's tests are plain Dart:
  # `dart test test/engine`, `dart test test/cli`.
  test: ^1.25.0

# The CLI component (lib/src/cli). The supported invocation is
# `dart run flutter_testsmith:testsmith` from an application that depends
# on this package. `dart pub global activate flutter_testsmith` installs a
# `testsmith` launcher too, but pub runs global executables of packages
# that need the Flutter SDK only from the snapshot built at activation:
# after a Dart SDK upgrade, activate again (ADR-0011).
executables:
  testsmith: testsmith
