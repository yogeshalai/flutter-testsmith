name: flutter_testsmith
description: >-
  In-application instrumentation for Flutter Testsmith.
  Captures navigation, UI structure and network traffic in test mode, and
  exposes them to the out-of-process test engine.
version: 0.1.3
publish_to: none
repository: https://github.com/yogeshalai/flutter-testsmith/tree/main/packages/flutter_testsmith
issue_tracker: https://github.com/yogeshalai/flutter-testsmith/issues
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0
  flutter_testsmith_protocol: ^0.1.1

  # The engine component's dependencies (lib/src/engine, ADR-0011). The
  # application under test never links them: nothing reachable from
  # lib/flutter_testsmith.dart imports engine code, which
  # scripts/check_dependencies.dart enforces as rule A. The two workspace
  # members leave this list when they move in too.
  ai_client: ^0.1.0
  flutter_testsmith_figma: ^0.1.0
  image: ^4.9.2
  vm_service: ^15.0.0
  yaml: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  # The engine's tests are plain Dart: `dart test test/engine`.
  test: ^1.25.0
